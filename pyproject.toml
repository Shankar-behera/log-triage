
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "log-triage"
version = "0.1.0"
description = "Local-first deterministic log triage for CI with optional LLM explanations and actionable reports."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Shankar Behera", email = "Shankar.blp2003@gmail.com" }]
keywords = ["logs", "ci", "devops", "sre", "triage", "offline", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "click>=8.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "ruff>=0.1.9",
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "python-multipart>=0.0.18",
    "httpx>=0.25",
    "httpx2",
    "jsonschema>=4.20,<5",
]
service = [
    "fastapi>=0.110,<1.0",
    "uvicorn>=0.27,<1.0",
    "httpx>=0.25",
]
demo = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "python-multipart>=0.0.18",
    "httpx>=0.25",
    "aiofiles>=23.2",
]

[project.scripts]
log-triage = "cli:triage"
log-triage-server = "logtriage_service.__main__:main"

[tool.setuptools]
packages = ["app", "logtriage", "logtriage_service"]
py-modules = ["cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [
    ".venv",
    ".venv-package-test",
    "venv",
    "build",
    "dist",
    "__pycache__",
]
[tool.ruff.lint]
select = ["F", "E9"]
