name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      live_groq_smoke:
        description: "Run an opt-in live Groq model/credential smoke test (uses API quota)"
        required: true
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,service,demo]"
      - run: python -m ruff check app/ cli.py demo/ logtriage/ logtriage_service/ scripts/ tests/
      - run: python -m pytest tests/ -q

  live-groq-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.live_groq_smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,service,demo]"
      - name: Check configured live Groq model
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/check_groq.py
